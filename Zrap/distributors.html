<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zrap · For distributors</title>
<style>
  :root {
    --zrap-green: #B6FF3C;
    --zrap-ink: #0a0a0a;
    --zrap-ink-2: #141414;
    --zrap-ink-3: #1d1d1d;
    --zrap-dim: #8a8a8a;
    --zrap-line: #262626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: var(--zrap-ink); color: #f2f2f2; font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; border-bottom: 1px solid var(--zrap-line);
  }
  .brand { font-size: 26px; font-weight: 800; font-style: italic; letter-spacing: -1px; color: var(--zrap-green); }
  .back { color: var(--zrap-dim); font-size: 13px; }
  .back:hover { color: #fff; }

  main { max-width: 900px; margin: 40px auto; padding: 0 24px 60px; }
  h1 { font-size: 32px; letter-spacing: -0.8px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 32px 0 14px; }
  .muted { color: var(--zrap-dim); font-size: 14px; }

  .card {
    background: var(--zrap-ink-2); border: 1px solid var(--zrap-line); border-radius: 14px; padding: 22px;
    margin-top: 20px; max-width: 480px;
  }
  label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--zrap-dim); display: block; margin-top: 14px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=url], select {
    width: 100%; padding: 10px 12px; margin-top: 6px; background: var(--zrap-ink);
    border: 1px solid var(--zrap-line); border-radius: 10px; color: #fff; outline: none;
  }
  input:focus, select:focus { border-color: var(--zrap-green); }
  input[type=file] {
    width: 100%; margin-top: 6px; padding: 8px; background: var(--zrap-ink);
    border: 1px dashed var(--zrap-line); border-radius: 10px; color: #fff;
  }
  .btn {
    background: var(--zrap-green); color: var(--zrap-ink); font-weight: 700;
    padding: 10px 22px; border-radius: 22px; margin-top: 20px;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 13px; min-height: 16px; color: var(--zrap-dim); }
  .status.err { color: #ff5a5a; }
  .status.ok { color: var(--zrap-green); }

  .hero { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
  .logo {
    width: 90px; height: 90px; border-radius: 14px; background: var(--zrap-ink-3); color: var(--zrap-green);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 36px; overflow: hidden; flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; background: var(--zrap-ink-3); color: var(--zrap-dim); font-size: 11px; margin-right: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 10px; }
  .mini-card {
    background: var(--zrap-ink-2); border-radius: 10px; padding: 12px; text-align: center;
  }
  .mini-card .av {
    width: 60px; height: 60px; margin: 0 auto 8px; border-radius: 50%; background: #333;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; overflow: hidden;
  }
  .mini-card .av img { width: 100%; height: 100%; object-fit: cover; }
  .mini-card .n { font-size: 13px; font-weight: 500; }
  .mini-card .s { font-size: 11px; color: var(--zrap-dim); margin-top: 2px; }

  .empty { padding: 20px; color: var(--zrap-dim); font-size: 14px; background: var(--zrap-ink-2); border-radius: 10px; }
  #loading { padding: 60px; text-align: center; color: var(--zrap-dim); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">zrap</a>
  <a href="index.html" class="back">← Back to app</a>
</header>

<main>
  <div id="loading">Loading…</div>
  <div id="content" style="display:none"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { firebaseConfig, slug, escapeHtml, uploadToB2 } from "./shared.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let userProfile = null;
let myDist = null;
let allArtists = [];
let allAlbums = [];
let allSongs = [];

const content = document.getElementById('content');
const loading = document.getElementById('loading');

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  const pSnap = await get(ref(db, `users/${user.uid}/profile`));
  userProfile = pSnap.exists() ? pSnap.val() : {};

  onValue(ref(db, 'artists'), snap => {
    allArtists = Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));
    render();
  });
  onValue(ref(db, 'albums'), snap => {
    allAlbums = Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));
    render();
  });
  onValue(ref(db, 'songs'), snap => {
    allSongs = Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));
    render();
  });

  if (userProfile.distributorId) {
    onValue(ref(db, `distributors/${userProfile.distributorId}`), snap => {
      myDist = snap.exists() ? { id: userProfile.distributorId, ...snap.val() } : null;
      render();
    });
  } else {
    render();
  }
});

function render() {
  loading.style.display = 'none';
  content.style.display = 'block';

  if (!myDist) {
    content.innerHTML = `
      <h1>Distributor portal</h1>
      <div class="muted">Register a label or distributor to onboard artists.</div>
      <div class="card">
        <label>Distributor name</label>
        <input id="claim-name" type="text" placeholder="e.g. Nightline Records" />
        <label>Website</label>
        <input id="claim-web" type="url" placeholder="https://" />
        <button class="btn" id="claim-btn">Create distributor</button>
        <div class="status err" id="claim-status"></div>
      </div>
    `;
    document.getElementById('claim-btn').onclick = claimDist;
    return;
  }

  const myArtists = allArtists.filter(a => a.distributorId === myDist.id);
  const pending = myArtists.filter(a => a.status === 'pending');
  const roster = myArtists.filter(a => a.status !== 'pending');
  const releases = allAlbums.filter(a => roster.some(r => r.id === a.artistId));
  const totalSongs = allSongs.filter(s => roster.some(r => r.id === s.artistId)).length;

  content.innerHTML = `
    <div class="hero">
      <div class="logo">${myDist.logo ? `<img src="${escapeHtml(myDist.logo)}">` : escapeHtml(myDist.name[0].toUpperCase())}</div>
      <div>
        <div class="muted" style="text-transform:uppercase; letter-spacing:2px; font-size:11px;">Distributor portal</div>
        <h1>${escapeHtml(myDist.name)}</h1>
        <div style="margin-top:6px">
          <span class="pill">${roster.length} artists</span>
          <span class="pill">${releases.length} releases</span>
          <span class="pill">${totalSongs} tracks</span>
        </div>
      </div>
    </div>

    <h2>Edit profile</h2>
    <div class="card">
      <label>Name</label>
      <input id="prof-name" type="text" value="${escapeHtml(myDist.name)}" />
      <label>Website</label>
      <input id="prof-web" type="url" value="${escapeHtml(myDist.website || '')}" placeholder="https://" />
      <label>Logo</label>
      <input type="file" id="prof-logo" accept="image/*" />
      <button class="btn" id="prof-save">Save</button>
      <div class="status" id="prof-status"></div>
    </div>

    ${pending.length ? `
      <h2>Pending requests <span style="background:var(--zrap-green); color:var(--zrap-ink); font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px;">${pending.length}</span></h2>
      <div>
        ${pending.map(a => `
          <div style="display:flex; align-items:center; gap:14px; padding:14px; background:var(--zrap-ink-2); border:1px solid var(--zrap-line); border-radius:12px; margin-bottom:8px;">
            <div class="logo" style="width:48px; height:48px; border-radius:50%; background:#333; font-size:18px;">${escapeHtml(a.name[0].toUpperCase())}</div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:500;">${escapeHtml(a.name)}</div>
              <div class="muted" style="font-size:12px;">requested ${a.requestedAt ? new Date(a.requestedAt).toLocaleDateString() : ''}</div>
            </div>
            <button class="btn" data-approve="${a.id}" style="margin:0; padding:8px 16px;">Approve</button>
            <button data-reject="${a.id}" style="padding:8px 16px; border:1px solid var(--zrap-line); border-radius:22px; color:#ff5a5a;">Reject</button>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <h2>Roster</h2>
    ${roster.length ? `
      <div class="grid">
        ${roster.map(a => `
          <div class="mini-card">
            <div class="av">${a.photo ? `<img src="${escapeHtml(a.photo)}">` : escapeHtml(a.name[0].toUpperCase())}</div>
            <div class="n">${escapeHtml(a.name)}</div>
            <div class="s">${allSongs.filter(s => s.artistId === a.id).length} tracks</div>
          </div>
        `).join('')}
      </div>
    ` : `<div class="empty">No artists signed yet. Share your distributor name — artists can pick it when they create a profile.</div>`}

    <h2>Releases</h2>
    ${releases.length ? `
      <div class="grid">
        ${releases.map(al => {
          const ar = roster.find(r => r.id === al.artistId);
          return `
            <div class="mini-card">
              <div class="av" style="border-radius:8px; background:var(--zrap-green); color:var(--zrap-ink); font-style:italic; font-family:Georgia,serif">${escapeHtml(al.title[0].toLowerCase())}</div>
              <div class="n">${escapeHtml(al.title)}</div>
              <div class="s">${ar ? escapeHtml(ar.name) : ''}</div>
            </div>
          `;
        }).join('')}
      </div>
    ` : `<div class="empty">No releases yet.</div>`}
  `;

  document.getElementById('prof-save').onclick = saveProfile;
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approveArtist(b.dataset.approve));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => rejectArtist(b.dataset.reject));
}

async function approveArtist(artistId) {
  await update(ref(db, `artists/${artistId}`), { status: 'approved', approvedAt: Date.now() });
}

async function rejectArtist(artistId) {
  if (!confirm('Reject this artist? Their request will be deleted and the name freed.')) return;
  const snap = await get(ref(db, `artists/${artistId}`));
  const ownerUid = snap.val()?.ownerUid;
  await set(ref(db, `artists/${artistId}`), null);
  if (ownerUid) {
    await update(ref(db, `users/${ownerUid}/profile`), { role: 'listener', artistId: null });
  }
}

async function claimDist() {
  const name = document.getElementById('claim-name').value.trim();
  const web = document.getElementById('claim-web').value.trim();
  const status = document.getElementById('claim-status');
  status.textContent = '';
  if (!name) { status.textContent = 'Pick a name.'; return; }
  const distId = slug(name);
  if (!distId) { status.textContent = 'Name needs letters.'; return; }
  const exists = await get(ref(db, `distributors/${distId}`));
  if (exists.exists()) { status.textContent = 'That name is taken, try another.'; return; }
  const data = { name, logo: '', website: web, ownerUid: currentUser.uid, createdAt: Date.now() };
  await set(ref(db, `distributors/${distId}`), data);
  await update(ref(db, `users/${currentUser.uid}/profile`), { role: 'distributor', distributorId: distId });
  myDist = { id: distId, ...data };
  onValue(ref(db, `distributors/${distId}`), snap => {
    myDist = snap.exists() ? { id: distId, ...snap.val() } : null; render();
  });
  render();
}

async function saveProfile() {
  const status = document.getElementById('prof-status');
  const btn = document.getElementById('prof-save');
  const name = document.getElementById('prof-name').value.trim();
  const web = document.getElementById('prof-web').value.trim();
  const logoFile = document.getElementById('prof-logo').files[0];
  status.className = 'status';
  if (!name) { status.textContent = 'Name required.'; status.className = 'status err'; return; }
  btn.disabled = true;
  try {
    const patch = { name, website: web };
    if (logoFile) {
      status.textContent = 'Uploading logo…';
      patch.logo = await uploadToB2(logoFile, `distributors/${myDist.id}`);
    }
    await update(ref(db, `distributors/${myDist.id}`), patch);
    status.className = 'status ok';
    status.textContent = '✓ Saved.';
  } catch (e) {
    status.className = 'status err';
    status.textContent = 'Error: ' + e.message;
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
